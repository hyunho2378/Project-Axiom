<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXIOM Crystal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W(), H());
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.07);

    const camera = new THREE.PerspectiveCamera(38, W() / H(), 0.1, 100);
    camera.position.set(0, 1.2, 7.5);
    camera.lookAt(0, 0, 0);

    function makeGlowTexture(innerColor, outerColor, size = 256) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, innerColor);
      grad.addColorStop(0.15, innerColor.replace('1)', '0.85)'));
      grad.addColorStop(0.4, outerColor.replace('1)', '0.4)'));
      grad.addColorStop(0.7, outerColor.replace('1)', '0.12)'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    const glowTex1 = makeGlowTexture('rgba(255,255,255,1)', 'rgba(0,212,255,1)', 512);
    const glowTex2 = makeGlowTexture('rgba(0,212,255,1)', 'rgba(42,104,133,1)', 512);
    const glowTex3 = makeGlowTexture('rgba(192,240,255,1)', 'rgba(0,180,220,1)', 256);

    function makeGlowSprite(tex, size, opacity, color) {
      const mat = new THREE.SpriteMaterial({ map: tex, color: new THREE.Color(color), transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
      const s = new THREE.Sprite(mat); s.scale.set(size, size, 1); return s;
    }

    function makePetalGeo(len, wid, curve, segs = 20) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.bezierCurveTo(-wid * 0.55, len * 0.28, -wid, len * 0.58, 0, len);
      shape.bezierCurveTo(wid, len * 0.58, wid * 0.55, len * 0.28, 0, 0);
      const geo = new THREE.ShapeGeometry(shape, segs);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const t = pos.getY(i) / len;
        pos.setZ(i, Math.sin(Math.PI * t) * curve);
        pos.setX(i, pos.getX(i) * (1 - t * 0.12));
      }
      geo.computeVertexNormals(); return geo;
    }

    function makeMat(colorHex, emitHex, emitInt, metal, rough) {
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(colorHex), emissive: new THREE.Color(emitHex),
        emissiveIntensity: emitInt, metalness: metal, roughness: rough,
        clearcoat: 1.0, clearcoatRoughness: 0.03, side: THREE.DoubleSide,
      });
    }

    const flower = new THREE.Group(); scene.add(flower);
    const LAYERS = [
      { n: 5, len: 0.55, wid: 0.14, crv: 0.10, elev: 82, y: 0.18, ca: 0x1E8899, cb: 0x00C4EF, ea: 0x00D4FF, eb: 0x80EEFF, ei: 2.0 },
      { n: 7, len: 0.88, wid: 0.23, crv: 0.15, elev: 62, y: 0.06, ca: 0x0D4A5E, cb: 0x1E8899, ea: 0x1E88AA, eb: 0x00C4EF, ei: 0.9 },
      { n: 9, len: 1.25, wid: 0.31, crv: 0.20, elev: 40, y: -0.08, ca: 0x082B38, cb: 0x0D4A5E, ea: 0x0D4A5E, eb: 0x1E8899, ei: 0.5 },
      { n: 11, len: 1.65, wid: 0.37, crv: 0.25, elev: 20, y: -0.22, ca: 0x040F16, cb: 0x082B38, ea: 0x061E2A, eb: 0x0D4A5E, ei: 0.25 },
      { n: 13, len: 2.05, wid: 0.42, crv: 0.30, elev: 7, y: -0.36, ca: 0x010508, cb: 0x040F16, ea: 0x030A10, eb: 0x061E2A, ei: 0.10 },
    ];
    const allPetalMats = [];
    LAYERS.forEach((L, li) => {
      const geo = makePetalGeo(L.len, L.wid, L.crv);
      const tiltX = THREE.MathUtils.degToRad(90 - L.elev);
      const stagger = li * Math.PI * 0.27;
      for (let i = 0; i < L.n; i++) {
        const t = i / L.n;
        const color = new THREE.Color(L.ca).lerp(new THREE.Color(L.cb), t);
        const emit = new THREE.Color(L.ea).lerp(new THREE.Color(L.eb), t);
        const mat = makeMat(color.getHex(), emit.getHex(), L.ei, 0.82 + li * 0.03, 0.035 + li * 0.022);
        allPetalMats.push({ mat, baseEI: L.ei });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true; mesh.receiveShadow = true;
        const pivot = new THREE.Group();
        pivot.rotation.y = (i / L.n) * Math.PI * 2 + stagger;
        pivot.position.y = L.y; mesh.rotation.x = tiltX;
        pivot.add(mesh); flower.add(pivot);
      }
    });

    const core = new THREE.Mesh(new THREE.SphereGeometry(0.10, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.95 }));
    core.position.y = 0.18; flower.add(core);

    const glowGroup = new THREE.Group(); glowGroup.position.y = 0.18; flower.add(glowGroup);
    const g1 = makeGlowSprite(glowTex3, 0.6, 1.0, 0xFFFFFF);
    const g2 = makeGlowSprite(glowTex1, 1.8, 0.9, 0x88EEFF);
    const g3 = makeGlowSprite(glowTex2, 3.6, 0.7, 0x00D4FF);
    const g4 = makeGlowSprite(glowTex2, 6.5, 0.35, 0x1E5672);
    glowGroup.add(g1, g2, g3, g4);

    // 렌즈 플레어 전부 제거 — 이게 꽃 아래로 빛 새는 원인이었음

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.015, 8, 80),
      new THREE.MeshBasicMaterial({ color: 0x00D4FF, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
    ring.position.y = 0.18; ring.rotation.x = Math.PI / 2; flower.add(ring);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.007, 6, 100),
      new THREE.MeshBasicMaterial({ color: 0x2A6885, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
    ring2.position.y = 0.18; ring2.rotation.x = Math.PI / 2; flower.add(ring2);

    // 바닥 반사면 + floorGlow 둘 다 제거 (꽃 아래 빛 새는 두 번째 원인)

    // 파티클도 꽃 위쪽만 분포하도록 — 아래쪽 파티클이 작은 점으로 보이는 원인 제거
    const PC = 280;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PC * 3);
    for (let i = 0; i < PC; i++) {
      const r = 3.0 + Math.random() * 3.5;
      const theta = Math.random() * Math.PI * 2;
      // phi를 0 ~ PI/2 사이로 제한 → y 양수만 (꽃 위쪽에만 파티클)
      const phi = Math.random() * Math.PI * 0.4;
      pPos[i * 3] = r * Math.cos(phi) * Math.cos(theta);
      pPos[i * 3 + 1] = r * Math.sin(phi);  // 항상 양수
      pPos[i * 3 + 2] = r * Math.cos(phi) * Math.sin(theta);
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x3AAFCC, size: 0.02, transparent: true, opacity: 0.5, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(particles);

    scene.add(new THREE.AmbientLight(0x06141A, 1.2));
    const coreLight = new THREE.PointLight(0x00D4FF, 35, 6, 2.0); coreLight.position.set(0, 0.18, 0); flower.add(coreLight);
    const coreLight2 = new THREE.PointLight(0xC0F0FF, 20, 3, 2.5); coreLight2.position.set(0, 0.18, 0); flower.add(coreLight2);
    const keyLight = new THREE.SpotLight(0xAADDFF, 50, 28, Math.PI / 5, 0.35, 1.5);
    keyLight.position.set(5, 10, 5); keyLight.target.position.set(0, 0, 0);
    keyLight.castShadow = true; keyLight.shadow.mapSize.set(2048, 2048); keyLight.shadow.bias = -0.0005; keyLight.shadow.radius = 10;
    scene.add(keyLight); scene.add(keyLight.target);
    const fillLight = new THREE.PointLight(0x1E5672, 8, 18, 2); fillLight.position.set(-5, -1, 4); scene.add(fillLight);
    const rimLight = new THREE.SpotLight(0x00D4FF, 28, 18, Math.PI / 6, 0.5, 2);
    rimLight.position.set(-2, -5, -4); rimLight.target.position.set(0, 0, 0); scene.add(rimLight); scene.add(rimLight.target);

    let dragging = false, lx = 0, ly = 0, vx = 0.0005, vy = 0, rotX = 0.18, rotY = 0;
    canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; vx = 0; vy = 0; });
    canvas.addEventListener('mousemove', e => { if (!dragging) return; const dx = (e.clientX - lx) * 0.009, dy = (e.clientY - ly) * 0.007; rotY += dx * 1.6; rotX = Math.max(-0.85, Math.min(0.85, rotX + dy * 1.6)); vx = dx; vy = dy; lx = e.clientX; ly = e.clientY; });
    canvas.addEventListener('mouseup', () => { dragging = false; setTimeout(() => { if (!dragging) vx = 0.0005; }, 1500); });
    canvas.addEventListener('mouseleave', () => { dragging = false; setTimeout(() => { if (!dragging) vx = 0.0005; }, 1500); });
    canvas.addEventListener('touchstart', e => { dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; vx = 0; vy = 0; }, { passive: true });
    canvas.addEventListener('touchmove', e => { if (!dragging) return; const dx = (e.touches[0].clientX - lx) * 0.009, dy = (e.touches[0].clientY - ly) * 0.007; rotY += dx * 1.6; rotX = Math.max(-0.85, Math.min(0.85, rotX + dy * 1.6)); vx = dx; vy = dy; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, { passive: true });
    canvas.addEventListener('touchend', () => { dragging = false; setTimeout(() => { if (!dragging) vx = 0.0005; }, 1500); });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (!dragging) { rotY += vx; vx *= 0.994; rotX += vy; vy *= 0.90; }
      flower.rotation.y = rotY;
      flower.rotation.x = rotX + Math.sin(t * 0.22) * 0.022;
      flower.scale.setScalar(1 + Math.sin(t * 0.55) * 0.015);
      const pulse = 0.88 + Math.sin(t * 1.0) * 0.12;
      g1.material.opacity = 1.0 * pulse; g2.material.opacity = 0.9 * pulse;
      g3.material.opacity = 0.7 * (0.85 + Math.sin(t * 0.7) * 0.15);
      g4.material.opacity = 0.35 * (0.8 + Math.sin(t * 0.5) * 0.2);
      const gs = 1 + Math.sin(t * 1.0) * 0.08;
      g1.scale.set(0.6 * gs, 0.6 * gs, 1); g2.scale.set(1.8 * gs, 1.8 * gs, 1);
      g3.scale.set(3.6 * (1 + Math.sin(t * 0.7) * 0.05), 3.6 * (1 + Math.sin(t * 0.7) * 0.05), 1);
      coreLight.intensity = 35 + Math.sin(t * 1.0) * 12;
      coreLight2.intensity = 20 + Math.sin(t * 0.8) * 8;
      allPetalMats.forEach(({ mat, baseEI }, i) => { mat.emissiveIntensity = baseEI * (0.82 + Math.sin(t * 0.65 + i * 0.35) * 0.18); });
      ring.rotation.z = t * 0.18; ring.material.opacity = 0.42 + Math.sin(t * 0.85) * 0.14;
      ring2.rotation.z = -t * 0.10; ring2.material.opacity = 0.18 + Math.sin(t * 0.6) * 0.08;
      keyLight.position.x = 5 + Math.sin(t * 0.18) * 0.8; keyLight.position.z = 5 + Math.cos(t * 0.18) * 0.8;
      particles.rotation.y = t * 0.032; particles.rotation.x = t * 0.011;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = W() / H();
      camera.updateProjectionMatrix();
      renderer.setSize(W(), H());
    });
  </script>
</body>

</html>
