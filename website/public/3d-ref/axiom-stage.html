<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AXIOM Product Stage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden;font-family:'Helvetica Neue',sans-serif}
  canvas{display:block;width:100vw;height:100vh}

</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;

const scene = new THREE.Scene();

// ── 배경: 그라디언트 + 빛 기둥 ──────────────────
// 큰 구체 BackSide에 ShaderMaterial — 위는 살짝 밝고 아래는 어두움
const bgGeo = new THREE.SphereGeometry(40, 32, 32);
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor:    { value: new THREE.Color('#0B2838') },
    midColor:    { value: new THREE.Color('#040A12') },
    bottomColor: { value: new THREE.Color('#06121A') },
  },
  vertexShader: `
    varying vec3 vWorldPosition;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPosition = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 bottomColor;
    varying vec3 vWorldPosition;
    void main(){
      float h = normalize(vWorldPosition).y;
      vec3 col;
      if (h > 0.0) col = mix(midColor, topColor, smoothstep(0.0, 0.7, h));
      else         col = mix(midColor, bottomColor, smoothstep(0.0, 0.7, -h));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
scene.add(new THREE.Mesh(bgGeo, bgMat));

const camera = new THREE.PerspectiveCamera(38, W()/H(), 0.1, 100);
camera.position.set(0, 1.0, 7);
camera.lookAt(0, 0, 0);

// ── 바닥 반사 면 (그림자 대신 광택 반사) ─────────
const floorGeo = new THREE.CircleGeometry(8, 64);
const floorMat = new THREE.MeshPhysicalMaterial({
  color: 0x040A12,
  metalness: 0.9,
  roughness: 0.25,
  envMapIntensity: 1.2,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.0;
scene.add(floor);

// 바닥 글로우 (제품 아래 빛 번짐)
function makeGlowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
  g.addColorStop(0, 'rgba(138, 174, 192, 0.55)');
  g.addColorStop(0.5, 'rgba(42, 104, 133, 0.15)');
  g.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(c);
}
const floorGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTex(),
  color: 0x8AAEC0,
  transparent: true, opacity: 0.30,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
floorGlow.scale.set(6, 2.5, 1);
floorGlow.position.set(0, -1.95, 0);
scene.add(floorGlow);

// ── 떠다니는 입자 (먼지 같은 빛) ───────────────────
const DUST = 250;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST * 3);
const dustVel = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3]   = (Math.random() - 0.5) * 14;
  dustPos[i*3+1] = (Math.random() - 0.5) * 10;
  dustPos[i*3+2] = (Math.random() - 0.5) * 8;
  dustVel[i] = 0.0004 + Math.random() * 0.0008;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xC0D8E0, size: 0.018,
  transparent: true, opacity: 0.4,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

// ── 조명 — 광택 강조 ─────────────────────────────
scene.add(new THREE.AmbientLight(0x06141A, 0.7));

// 천장 키라이트 (스포트라이트) — 차가운 흰빛
const keyLight = new THREE.SpotLight(0xC8E4F0, 30, 24, Math.PI/5, 0.4, 1.4);
keyLight.position.set(0, 9, 4);
keyLight.target.position.set(0, 0, 0);
scene.add(keyLight);
scene.add(keyLight.target);

// 좌측 필
const fillLight = new THREE.PointLight(0x2A6885, 9, 16, 2);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

// 우측 림
const rimLight = new THREE.PointLight(0x6CA0BC, 11, 16, 2);
rimLight.position.set(5, 1, -3);
scene.add(rimLight);

// 바닥 업라이트 (제품 밑면 살짝 밝게)
const upLight = new THREE.PointLight(0x1E5672, 5, 8, 2);
upLight.position.set(0, -1.9, 0);
scene.add(upLight);

// ── ANIMATE ──────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 먼지 천천히 떠오르기
  const arr = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    arr[i*3+1] += dustVel[i];
    if (arr[i*3+1] > 5) arr[i*3+1] = -5;
    arr[i*3] += Math.sin(t * 0.3 + i) * 0.0008;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // 키라이트 미세 흔들림 (살아있는 느낌)
  keyLight.intensity = 30 + Math.sin(t * 0.3) * 1.5;
  keyLight.position.x = Math.sin(t * 0.08) * 0.4;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = W()/H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
});
</script>
</body>
</html>
