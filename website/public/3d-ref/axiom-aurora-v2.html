<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXIOM Aurora Ring v2</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(36, W()/H(), 0.1, 100);
camera.position.set(0, 2.8, 6.5);
camera.lookAt(0, 0, 0);

// ── GLOW TEXTURE ─────────────────────────────────
function makeGlowTex(inner, outer, size=256) {
  const c2 = document.createElement('canvas');
  c2.width = c2.height = size;
  const ctx = c2.getContext('2d');
  const g = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  g.addColorStop(0,    inner);
  g.addColorStop(0.2,  inner.replace('1)','0.5)'));
  g.addColorStop(0.55, outer.replace('1)','0.15)'));
  g.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c2);
}
const glowTex = makeGlowTex('rgba(0,212,255,1)','rgba(30,86,114,1)', 256);
const coreTex = makeGlowTex('rgba(192,240,255,1)','rgba(0,160,200,1)', 512);

// ── RING GROUP ───────────────────────────────────
const ringGroup = new THREE.Group();
scene.add(ringGroup);

// 메인 링 — 매끈한 크리스탈/유리 질감
const mainRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.0, 0.065, 64, 256),
  new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#1E5672'),
    emissive: new THREE.Color('#00D4FF'),
    emissiveIntensity: 0.8,
    metalness: 0.95,
    roughness: 0.03,
    clearcoat: 1.0,
    clearcoatRoughness: 0.01,
    envMapIntensity: 2.5,
    reflectivity: 1.0,
  })
);
mainRing.rotation.x = Math.PI / 2;
ringGroup.add(mainRing);

// 안쪽 링 — 더 얇고, 더 밝게
const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.72, 0.035, 48, 256),
  new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#2A6885'),
    emissive: new THREE.Color('#00E0FF'),
    emissiveIntensity: 1.2,
    metalness: 0.95,
    roughness: 0.02,
    clearcoat: 1.0,
    clearcoatRoughness: 0.01,
    transparent: true,
    opacity: 0.85,
  })
);
innerRing.rotation.x = Math.PI / 2;
ringGroup.add(innerRing);

// 바깥 링 — 가장 얇고, 은은하게
const outerRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.35, 0.022, 32, 256),
  new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#0B3545'),
    emissive: new THREE.Color('#2A6885'),
    emissiveIntensity: 0.5,
    metalness: 0.92,
    roughness: 0.05,
    clearcoat: 1.0,
    transparent: true,
    opacity: 0.6,
  })
);
outerRing.rotation.x = Math.PI / 2;
ringGroup.add(outerRing);

// 글래스 디스크 — 링 사이 반투명 면 (토성 고리 느낌)
const discGeo = new THREE.RingGeometry(1.65, 2.42, 128);
const discMat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color('#0A2535'),
  emissive: new THREE.Color('#1E5672'),
  emissiveIntensity: 0.15,
  metalness: 0.6,
  roughness: 0.25,
  transparent: true,
  opacity: 0.12,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const disc = new THREE.Mesh(discGeo, discMat);
disc.rotation.x = -Math.PI / 2;
ringGroup.add(disc);

// ── 링 위 글로우 입자 ────────────────────────────
const GLOW_COUNT = 120;
const glowSprites = [];

for (let i = 0; i < GLOW_COUNT; i++) {
  const angle = (i / GLOW_COUNT) * Math.PI * 2;
  const rVariant = Math.random() < 0.5 ? 2.0 : (Math.random() < 0.5 ? 1.72 : 2.35);
  const spread = (Math.random() - 0.5) * 0.15;

  const mat = new THREE.SpriteMaterial({
    map: glowTex,
    color: new THREE.Color(Math.random() > 0.7 ? 0xC0F0FF : 0x00D4FF),
    transparent: true,
    opacity: 0.25 + Math.random() * 0.25,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  const sz = 0.15 + Math.random() * 0.2;
  sprite.scale.set(sz, sz, 1);
  sprite.position.set(
    Math.cos(angle) * (rVariant + spread),
    (Math.random() - 0.5) * 0.08,
    Math.sin(angle) * (rVariant + spread)
  );
  ringGroup.add(sprite);
  glowSprites.push({ sprite, baseAngle: angle, radius: rVariant + spread, speed: 0.015 + Math.random() * 0.02 });
}

// ── 중심 코어 글로우 ─────────────────────────────
const coreGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: coreTex, color: new THREE.Color(0x2A6885),
  transparent: true, opacity: 0.25,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
coreGlow.scale.set(5, 5, 1);
ringGroup.add(coreGlow);

// 링 아래 반사 글로우
const reflGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: coreTex, color: new THREE.Color(0x1E5672),
  transparent: true, opacity: 0.12,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
reflGlow.scale.set(6, 2, 1);
reflGlow.position.y = -1.5;
ringGroup.add(reflGlow);

// ── 배경 별 ──────────────────────────────────────
const BG = 900;
const bgGeo = new THREE.BufferGeometry();
const bgPos = new Float32Array(BG * 3);
for (let i = 0; i < BG; i++) {
  const r = 10 + Math.random() * 18;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  bgPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  bgPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  bgPos[i*3+2] = r * Math.cos(phi);
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({
  color: 0x5A9AB5, size: 0.022,
  transparent: true, opacity: 0.45,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending, depthWrite: false,
})));

// ── 조명 ─────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x040C14, 0.6));

// 키 — 위에서, 링 표면 하이라이트
const keyLight = new THREE.PointLight(0xC0F0FF, 18, 20, 1.8);
keyLight.position.set(-2, 7, 3);
scene.add(keyLight);

// 림 — 뒤아래에서, 테두리 빛
const rimLight = new THREE.PointLight(0x00D4FF, 14, 16, 1.6);
rimLight.position.set(3, -3, -4);
scene.add(rimLight);

// 필 — 옆에서 은은하게
const fillLight = new THREE.PointLight(0x1E5672, 5, 14, 2);
fillLight.position.set(-5, 0, 2);
scene.add(fillLight);

// 코어 라이트
const coreLight = new THREE.PointLight(0x2A6885, 6, 6, 2);
coreLight.position.set(0, 0, 0);
ringGroup.add(coreLight);

// ── INTERACTION ──────────────────────────────────
let dragging=false, lx=0, ly=0, vx=0, vy=0;
let manY=0, manX=0;

canvas.addEventListener('mousedown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; vx=0; vy=0; });
canvas.addEventListener('mousemove', e=>{
  if(!dragging) return;
  vx=(e.clientX-lx)*0.008; vy=(e.clientY-ly)*0.006;
  manY+=vx*1.2; manX=Math.max(-.8,Math.min(.8,manX+vy*1.2));
  lx=e.clientX; ly=e.clientY;
});
canvas.addEventListener('mouseup',    ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>dragging=false);
canvas.addEventListener('touchstart', e=>{ dragging=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:true});
canvas.addEventListener('touchmove',  e=>{
  if(!dragging) return;
  vx=(e.touches[0].clientX-lx)*0.008; vy=(e.touches[0].clientY-ly)*0.006;
  manY+=vx*1.2; manX=Math.max(-.8,Math.min(.8,manX+vy*1.2));
  lx=e.touches[0].clientX; ly=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend', ()=>dragging=false);

// ── ANIMATE ──────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 느린 자동 회전
  if (!dragging) {
    vx *= 0.93; vy *= 0.93;
    manY += vx; manX += vy;
  }
  ringGroup.rotation.y = t * 0.025 + manY;
  ringGroup.rotation.x = 0.35 + manX + Math.sin(t * 0.10) * 0.03;

  // 부동
  ringGroup.position.y = Math.sin(t * 0.18) * 0.12;

  // 링 emissive 펄스 — 느리고 우아하게
  const p1 = 0.92 + Math.sin(t * 0.3) * 0.08;
  const p2 = 0.92 + Math.sin(t * 0.25 + 1) * 0.08;
  const p3 = 0.92 + Math.sin(t * 0.2 + 2) * 0.08;
  mainRing.material.emissiveIntensity  = 0.8 * p1;
  innerRing.material.emissiveIntensity = 1.2 * p2;
  outerRing.material.emissiveIntensity = 0.5 * p3;

  // 디스크 은은한 펄스
  discMat.opacity = 0.10 + Math.sin(t * 0.22) * 0.03;

  // 글로우 입자 공전
  glowSprites.forEach(({ sprite, baseAngle, radius, speed }) => {
    const a = baseAngle + t * speed;
    sprite.position.x = Math.cos(a) * radius;
    sprite.position.z = Math.sin(a) * radius;
    sprite.material.opacity = 0.22 + Math.sin(t * 0.4 + baseAngle) * 0.12;
  });

  // 코어 글로우
  coreGlow.material.opacity = 0.22 + Math.sin(t * 0.25) * 0.05;
  coreGlow.scale.setScalar(5 + Math.sin(t * 0.18) * 0.3);

  // 키라이트 미세 이동
  keyLight.position.x = -2 + Math.sin(t * 0.06) * 0.5;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = W()/H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
});
</script>
</body>
</html>
